[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-doctor"
version = "1.0.0"
description = "Upload a packet capture and get a plain-English, evidence-backed network diagnosis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lanshah" }]
dependencies = ["dpkt>=1.9.8", "jinja2>=3.1", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
packet-doctor = "packet_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packet_doctor = ["templates/*.j2", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
