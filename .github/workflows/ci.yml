name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    name: Tests + Wireshark cross-check (Ubuntu, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tshark (Wireshark stable PPA, the outside judge)
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - name: Install Packet Doctor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (detection table + Wireshark agreement)
        run: pytest -v
      - name: Detection table
        run: packet-doctor validate samples
      - name: Wireshark agreement on the sample corpus
        run: packet-doctor judge samples/*.pcap samples/*.pcapng
      - name: Build sample reports
        run: packet-doctor demo --out ci_reports
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: sample-reports
          path: ci_reports/

  test-windows:
    name: Tests (Windows, Python 3.14, no tshark)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -v
