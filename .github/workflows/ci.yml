name: CI

on:
  push:
  pull_request:

jobs:
  wireshark-judge:
    name: Tests + Wireshark cross-check (Ubuntu, Python 3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install tshark (the outside judge)
        # Launchpad's Wireshark PPA sometimes answers 503. Retry it, then fall back to
        # Ubuntu's own (older) tshark; the agreement test skips itself on tshark < 4.6.
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          ok=0
          for attempt in 1 2 3; do
            if sudo add-apt-repository -y ppa:wireshark-dev/stable \
               && sudo apt-get -o Acquire::Retries=5 update \
               && sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y tshark; then
              ok=1; break
            fi
            echo "PPA attempt $attempt failed, waiting 30 s"; sleep 30
          done
          if [ "$ok" = 0 ]; then
            echo "::warning::Wireshark PPA unavailable; using Ubuntu's tshark (frame agreement test will be skipped if < 4.6)"
            sudo add-apt-repository -y --remove ppa:wireshark-dev/stable || true
            sudo apt-get -o Acquire::Retries=5 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y tshark
          fi
          tshark --version | head -1
      - name: Install Packet Doctor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (detection table + Wireshark agreement)
        run: pytest -v -rs
      - name: Detection table
        run: packet-doctor validate samples
      - name: Wireshark agreement on the sample corpus
        run: packet-doctor judge samples/*.pcap samples/*.pcapng
      - name: Build sample reports
        run: packet-doctor demo --out ci_reports
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reports
          path: ci_reports/

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -v -rs
